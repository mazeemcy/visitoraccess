version: '3.8'

services:
  # PostgreSQL Database
  db: 
    image: postgres:15-alpine
    container_name: visitor-control-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visitor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visitor_pass}
      POSTGRES_DB: ${POSTGRES_DB:-visitor_control}
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init. sql: ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitor_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visitor-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: 
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name:  visitor-control-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-visitor_user}:${POSTGRES_PASSWORD:-visitor_pass}@db:5432/${POSTGRES_DB:-visitor_control}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      DEBUG: ${DEBUG:-False}
      HOST:  0.0.0.0
      PORT: 8000
      HIKVISION_TIMEOUT: 5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - visitor-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name:  visitor-control-ui
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
      REACT_APP_VERSION: ${REACT_APP_VERSION:-1.0.0}
      REACT_APP_ENV: ${REACT_APP_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - visitor-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: visitor-control-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes: 
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - visitor-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: 
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data: 
    driver: local

networks: 
  visitor-network:
    driver: bridge